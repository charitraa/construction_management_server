name: Deploy to PythonAnywhere
on:
  push:
    branches: [ main ]  # Adjust branch name as needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reload PythonAnywhere Web App
        uses: jensvog/pythonanywhere-webapp-reload-action@v1
        with:
          host: 'www.pythonanywhere.com'  # or 'eu.pythonanywhere.com' for EU servers
          username: ${{ secrets.PA_USERNAME }}
          api-token: ${{ secrets.PA_API_TOKEN }}
          domain-name: ${{ secrets.PA_DOMAIN_NAME }}